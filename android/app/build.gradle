plugins {
    id "com.android.application"
}

android {
    namespace "com.meandyson.findmatch"
    compileSdk 35

    defaultConfig {
        applicationId "com.meandyson.findmatch"
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName "0.1.13"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register("syncWeb", Copy) {
    from("${rootDir}/../dist-android") {
        exclude "version.json"
    }
    into("${projectDir}/src/main/assets")
    doFirst {
        def webDist = file("${rootDir}/../dist-android")
        def indexHtml = new File(webDist, "index.html")
        if (!webDist.exists() || !indexHtml.exists()) {
            throw new GradleException("Run: npm run build:android && npm run sync:android")
        }
        def html = indexHtml.getText("UTF-8")
        if (!html.contains("./assets/") || html.contains("src=\"/findmatch/")) {
            throw new GradleException(
                "dist-android is not an Android web build. Run: npm run build:android"
            )
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("syncWeb")
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}